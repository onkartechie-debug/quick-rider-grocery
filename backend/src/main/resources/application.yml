server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: quickrider
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickrider}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: QuickRiderPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  business:
    timezone: ${APP_TIMEZONE:Asia/Kolkata}
    low-stock-threshold: 10
  security:
    jwt:
      # Base64-encoded HMAC key (>= 256 bits). Override JWT_SECRET in every non-local environment.
      secret: ${JWT_SECRET:cXVpY2tyaWRlci1sb2NhbC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
      issuer: quickrider
    cookie:
      name: QR_ACCESS
      secure: ${COOKIE_SECURE:true}
      same-site: Strict
      path: /
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.quickrider: DEBUG
    org.springframework.security: INFO
