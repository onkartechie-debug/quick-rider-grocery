server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: quickrider
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quickrider}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: QuickRiderPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  business:
    timezone: ${APP_TIMEZONE:Asia/Kolkata}
    low-stock-threshold: 10
  security:
    jwt:
      # Base64-encoded HMAC key (>= 256 bits). Override JWT_SECRET in every non-local environment.
      secret: ${JWT_SECRET:cXVpY2tyaWRlci1sb2NhbC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
      issuer: quickrider
    cookie:
      name: QR_ACCESS
      secure: ${COOKIE_SECURE:true}
      same-site: Strict
      path: /
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  razorpay:
    # Razorpay TEST mode credentials (dev environment) - no real money moves. Override all three via
    # env vars in every other environment; LIVE keys (rzp_live_...) must only ever come from env vars.
    # key-id is handed to the browser for Checkout.js; key-secret and webhook-secret never leave the backend.
    key-id: ${RAZORPAY_KEY_ID:rzp_test_YpeuqwvvTh0xzG}
    key-secret: ${RAZORPAY_KEY_SECRET:aiCAYsYUgj5lRITZQ9wIOePg}
    # Razorpay dashboard (Test mode) -> Settings -> Webhooks secret - a different credential from key-secret,
    # used to verify X-Razorpay-Signature on POST /api/public/payments/razorpay/webhook.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:b377ef56d51ac9e7f8606ba69a08313fa04e4c03c50c7b144688de5fb48c452b}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    merchant-name: ${RAZORPAY_MERCHANT_NAME:QuickRider}
    # Online (UPI/CARD) orders reserve stock while AWAITING_PAYMENT; unpaid ones are cancelled after this.
    pending-payment-expiry-minutes: ${PAYMENT_EXPIRY_MINUTES:20}
    expiry-check-interval-ms: ${PAYMENT_EXPIRY_CHECK_MS:60000}
  sms:
    # Order SMS notifications. Disabled by default: ConsoleSmsSender logs messages instead of sending.
    # When enabling, provide the gateway credentials via env vars only - they have NO defaults on purpose,
    # so a missing value fails startup instead of sending with a bogus credential.
    enabled: ${SMS_ENABLED:false}
    base-url: ${SMS_BASE_URL:https://bulkpush.mytoday.com}
    feed-id: ${SMS_FEED_ID:}
    username: ${SMS_USERNAME:}
    password: ${SMS_PASSWORD:}
    job-name: ${SMS_JOB_NAME:}
    sender-suffix: ${SMS_SENDER_SUFFIX:- QuickRider}
  otp:
    # Login-by-OTP over SMS. master-otp is a DEV/TEST convenience that is accepted for any registered
    # mobile number - set MASTER_OTP to an empty value in every shared/production environment.
    master-otp: ${MASTER_OTP:111111}
    length: 6
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: 5
    resend-cooldown-seconds: 30
    max-per-hour: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.quickrider: DEBUG
    org.springframework.security: INFO
